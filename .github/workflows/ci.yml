
name: CI

on:
  push:
    branches: main
  pull_request:
  workflow_call:  # allow this workflow to be called from other workflows

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    outputs:
      snapshot: ${{ steps.version.outputs.snapshot }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: coursier/cache-action@v7
        with:
          extraFiles: deder.pkl
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
      - name: Install deder
        run: brew install sake92/tap/deder
      - name: Check versions
        id: version
        shell: bash
        run: |
          versions=$(deder exec -t version)
          echo "$versions"
          version=$(sed -nE 's/^[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+(-SNAPSHOT)?)$/\1/p' <<< "$versions" | sort -u)
          if [[ -z "$version" || "$version" == *$'\n'* ]]; then
            echo "Expected one version across all modules"
            exit 1
          fi
          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "snapshot=true" >> "$GITHUB_OUTPUT"
          else
            echo "snapshot=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Compile
        run: deder exec -t compile
      - name: Test
        run: deder exec -t test
      - name: Deder output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deder-logs
          path: |
            .deder/logs/server.log
  publish-snapshots:
    name: publish snapshots
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.outputs.snapshot == 'true'
    needs: test
    runs-on: ubuntu-latest
    env:
      DEDER_PUBLISH_SNAPSHOT: ${{ needs.test.outputs.snapshot }}
      DEDER_SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      DEDER_SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
      - name: Install deder
        run: brew install sake92/tap/deder
      - name: Publish snapshots
        run: deder exec -t publish -m formson% -m querson% -m validson% -m sharaf%
  compile-scala-cli-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: VirtusLab/scala-cli-setup@main
        with:
          jvm: temurin:21
      - name: Compile Scala CLI examples
        run: |
          ./scripts/compile-scala-cli-examples.sh examples/scala-cli
          ./scripts/compile-scala-cli-examples.sh examples/htmx
