name: Native examples and measurements

on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * 1'

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '21.0.10'
      - uses: VirtusLab/scala-cli-setup@main
      - name: Install native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang libunwind-dev zlib1g-dev time
      - name: Build, verify, and measure packaged examples
        run: scala-cli scripts/measure-native.scala --server=false -- --output out/native-measurements
      - name: Upload measurements, source snapshots, and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-measurements
          path: |
            out/native-measurements
            !out/native-measurements/**/app
            !out/native-measurements/**/app.jar
