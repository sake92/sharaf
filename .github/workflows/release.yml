name: Release
on:
  push:
    tags: "*"

env:
  DEDER_SONATYPE_PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
  DEDER_SONATYPE_PGP_SECRET: ${{ secrets.PGP_SECRET }}
  DEDER_SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
  DEDER_SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}

jobs:
  tests:
    uses: ./.github/workflows/ci.yml
  publish:
    runs-on: ubuntu-latest
    needs: [tests]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore Deder output cache
        uses: actions/cache/restore@v4
        with:
          path: .deder/out
          key: deder-${{ github.sha }}
          restore-keys: |
            deder-
      - uses: coursier/cache-action@v7
        with:
          extraFiles: deder.pkl
      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
      - name: Install deder
        run: brew install sake92/tap/deder
      # Exclude test and example modules.
      - name: Publish
        run: deder exec -t publish -m '~%-test%' -m '~examples%'
      - name: Dependency update prompt
        run: bash scripts/release-prompt.sh
      - name: Deder output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deder-logs
          path: |
            .deder/logs/server.log
