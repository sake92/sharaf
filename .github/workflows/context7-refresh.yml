name: Refresh Context7 Docs

on:
  push:
    branches:
      - main
    paths:
      - context7.json
      - docs/**
      - examples/**
      - .github/workflows/context7-refresh.yml
  workflow_dispatch:

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Configure CONTEXT7_API_KEY in repository Settings > Secrets and variables > Actions.
      - name: Trigger Context7 refresh
        env:
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
          LIBRARY_NAME: /${{ github.repository }}
        run: |
          if [[ -z "$CONTEXT7_API_KEY" ]]; then
            echo "::error::Set the CONTEXT7_API_KEY repository secret before running this workflow."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            -X POST https://context7.com/api/v1/refresh \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $CONTEXT7_API_KEY" \
            -d "$(jq -nc --arg libraryName "$LIBRARY_NAME" '{libraryName: $libraryName}')"
